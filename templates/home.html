<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Exam Performance Predictor</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #312e81);
            color: white;
            padding: 40px 20px;
        }

        .login {
            max-width: 800px;
            margin: auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .login > h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 35px;
            color: #c4b5fd;
        }

        legend {
            text-align: center;
            font-size: 22px;
            color: #e0e7ff;
            margin-bottom: 25px;
        }

        .mb-3 {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: bold;
        }

        .form-control {
            width: 100%;
            padding: 14px;
            border: 1px solid #475569;
            border-radius: 10px;
            background: #1e293b;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .form-control:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.4);
        }

        select.form-control {
            cursor: pointer;
        }

        select option {
            background: #1e293b;
            color: white;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            text-align: center;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid #6366f1;
            border-radius: 12px;
            color: #c4b5fd;
        }

        @media (max-width: 600px) {
            .login {
                padding: 25px 20px;
            }

            .login > h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login">

        <h1>Student Exam Performance Indicator</h1>

        <form action="{{ url_for('predict_datapoint') }}" method="post">

            <legend>Student Exam Performance Prediction</legend>

            <div class="mb-3">
                <label class="form-label">Gender</label>

                <select class="form-control" name="gender" required>
                    <option value="" selected disabled>
                        Select your Gender
                    </option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Race or Ethnicity</label>

                <select class="form-control" name="ethnicity" required>
                    <option value="" selected disabled>
                        Select Ethnicity
                    </option>
                    <option value="group A">Group A</option>
                    <option value="group B">Group B</option>
                    <option value="group C">Group C</option>
                    <option value="group D">Group D</option>
                    <option value="group E">Group E</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Parental Level of Education
                </label>

                <select class="form-control"
                        name="parental_level_of_education"
                        required>

                    <option value="" selected disabled>
                        Select Parent Education
                    </option>

                    <option value="associate's degree">
                        Associate's Degree
                    </option>

                    <option value="bachelor's degree">
                        Bachelor's Degree
                    </option>

                    <option value="high school">
                        High School
                    </option>

                    <option value="master's degree">
                        Master's Degree
                    </option>

                    <option value="some college">
                        Some College
                    </option>

                    <option value="some high school">
                        Some High School
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Lunch Type</label>

                <select class="form-control" name="lunch" required>
                    <option value="" selected disabled>
                        Select Lunch Type
                    </option>
                    <option value="free/reduced">
                        Free / Reduced
                    </option>
                    <option value="standard">
                        Standard
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Test Preparation Course
                </label>

                <select class="form-control"
                        name="test_preparation_course"
                        required>

                    <option value="" selected disabled>
                        Select Test Course
                    </option>

                    <option value="none">None</option>
                    <option value="completed">Completed</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Reading Score out of 100
                </label>

                <input class="form-control"
                       type="number"
                       name="reading_score"
                       placeholder="Enter your Reading Score"
                       min="0"
                       max="100"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Writing Score out of 100
                </label>

                <input class="form-control"
                       type="number"
                       name="writing_score"
                       placeholder="Enter your Writing Score"
                       min="0"
                       max="100"
                       required>
            </div>

            <div class="mb-3">
                <input class="btn"
                       type="submit"
                       value="Predict Maths Score">
            </div>

        </form>

        {% if results %}
        <div class="result">
            <h2>Predicted Maths Score: {{ results }}</h2>
        </div>
        {% endif %}

    </div>

</body>
</html>
